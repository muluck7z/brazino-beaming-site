<!DOCTYPE html>
<!-- build: 1780670176822 -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brazino Beaming</title>
  <link rel="icon" href="/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --primary-green:#1B7340;
      --vibrant-green:#39D353;
      --dark-green:#0D2818;
      --bg-light:#F4F9F5;
      --bg-card:#FFFFFF;
      --text-primary:#0D2818;
      --text-secondary:#6B7280;
      --accent-amber:#F59E0B;
      --shadow-sm:0 1px 3px rgba(13,40,24,.08);
      --shadow-md:0 4px 12px rgba(13,40,24,.12);
      --shadow-lg:0 8px 24px rgba(13,40,24,.15);
      --transition-fast:0.2s ease;
      --transition-normal:0.3s ease;
    }
    
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
    body{
      font-family:'Inter',sans-serif;
      background:var(--bg-light);
      color:var(--text-primary);
      min-height:100vh;
      overflow-x:hidden
    }

    /* Navbar */
    #navbar{
      position:fixed;top:0;left:0;right:0;z-index:50;height:64px;
      border-bottom:2px solid var(--vibrant-green);
      background:rgba(244,249,245,.95);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      box-shadow:var(--shadow-sm)
    }
    .nb{
      max-width:1280px;margin:0 auto;padding:0 1.5rem;height:100%;
      display:flex;align-items:center;justify-content:space-between;gap:1.5rem
    }
    .logo{display:flex;align-items:center;gap:.625rem;text-decoration:none;cursor:pointer}
    .logo-img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex-shrink:0;border:2px solid var(--primary-green)}
    .logo-text{font-size:1.175rem;font-weight:800;color:var(--primary-green);white-space:nowrap;font-family:'Poppins',sans-serif}
    .nav-links{display:flex;align-items:center;gap:2rem}
    .nav-link{
      font-size:.875rem;color:var(--text-secondary);cursor:pointer;
      transition:color var(--transition-fast);
      white-space:nowrap;text-decoration:none;position:relative;padding-bottom:2px;
      font-weight:500
    }
    .nav-link:hover{color:var(--primary-green)}
    .nav-link.active{color:var(--primary-green);font-weight:700}
    .nav-link.active::after{
      content:'';position:absolute;bottom:-2px;left:0;right:0;
      height:3px;background:var(--vibrant-green);border-radius:2px;
      animation:slideIn var(--transition-normal)
    }
    .nav-cta{
      background:var(--primary-green);color:#fff;border:none;border-radius:8px;
      padding:.5rem 1.125rem;font-size:.8125rem;font-weight:700;cursor:pointer;
      text-decoration:none;display:flex;align-items:center;gap:.375rem;
      white-space:nowrap;transition:all var(--transition-fast);
      box-shadow:var(--shadow-sm)
    }
    .nav-cta:hover{
      background:var(--vibrant-green);transform:translateY(-2px);box-shadow:var(--shadow-md)
    }
    .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px}
    .hamburger span{display:block;width:24px;height:2px;background:var(--primary-green);border-radius:2px;transition:all var(--transition-normal)}
    .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
    .hamburger.open span:nth-child(2){opacity:0}
    .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

    /* Mobile menu */
    #mobile-menu{
      display:none;position:fixed;top:64px;left:0;right:0;z-index:48;
      background:rgba(244,249,245,.98);backdrop-filter:blur(20px);
      border-bottom:2px solid var(--vibrant-green);padding:1.25rem 1.5rem 1.75rem;
      flex-direction:column;gap:.25rem;box-shadow:var(--shadow-md)
    }
    #mobile-menu.open{display:flex;animation:slideDown var(--transition-normal)}
    .mob-link{
      font-size:1rem;color:var(--text-secondary);cursor:pointer;padding:.875rem 0;
      border-bottom:1px solid rgba(13,40,24,.08);display:flex;align-items:center;
      gap:.75rem;text-decoration:none;transition:color var(--transition-fast);font-weight:500
    }
    .mob-link:hover,.mob-link.active{color:var(--primary-green);font-weight:700}
    .mob-link:last-of-type{border-bottom:none}
    .mob-cta{
      margin-top:1rem;background:var(--primary-green);color:#fff;border:none;
      border-radius:8px;padding:.75rem 1rem;font-size:.9375rem;font-weight:700;
      cursor:pointer;text-align:center;text-decoration:none;display:block;
      transition:all var(--transition-fast)
    }
    .mob-cta:hover{background:var(--vibrant-green);transform:translateY(-2px)}

    @media(max-width:900px){
      .nav-links{display:none}
      .nav-cta{display:none}
      .hamburger{display:flex}
    }

    #app{position:relative;z-index:1;min-height:100vh;padding-top:64px}

    /* Page header */
    .pg-header{position:relative;overflow:hidden;padding:5rem 1.5rem 3rem;text-align:center}
    .pg-glow{
      position:absolute;top:-50%;left:50%;transform:translateX(-50%);
      width:500px;height:500px;border-radius:50%;
      background:radial-gradient(ellipse 55% 50% at 50% 50%, rgba(57,211,83,.15) 0%, transparent 65%);
      filter:blur(100px);pointer-events:none
    }
    .pg-icon{
      width:64px;height:64px;border-radius:16px;
      background:rgba(57,211,83,.12);
      border:2px solid var(--vibrant-green);display:inline-flex;align-items:center;
      justify-content:center;color:var(--vibrant-green);margin:0 auto .875rem;
      animation:fadeUp .5s ease both
    }
    .pg-title{
      font-size:clamp(2.5rem,8vw,4.25rem);font-weight:900;
      letter-spacing:-.01em;color:var(--primary-green);font-family:'Poppins',sans-serif;
      animation:fadeUp .5s ease both .1s;animation-fill-mode:both
    }
    .pg-bar{width:56px;height:4px;background:var(--vibrant-green);margin:.625rem auto;border-radius:2px;animation:slideIn .5s ease both .2s;animation-fill-mode:both}
    .pg-sub{
      font-size:1rem;color:var(--text-secondary);max-width:600px;margin:.75rem auto 0;
      line-height:1.65;animation:fadeUp .5s ease both .3s;animation-fill-mode:both
    }

    /* Content */
    .content{max-width:1280px;margin:0 auto;padding:0 1.5rem 5rem}
    .divider{height:2px;background:linear-gradient(90deg, transparent, var(--vibrant-green), transparent);margin-bottom:3rem}
    .sec-item{margin-bottom:3.5rem}
    .sec-head{display:flex;align-items:center;gap:.875rem;margin-bottom:1.25rem}
    .sec-num{
      width:36px;height:36px;border-radius:50%;background:var(--vibrant-green);
      color:#fff;font-size:.8125rem;font-weight:800;display:flex;align-items:center;
      justify-content:center;flex-shrink:0;font-family:'Poppins',sans-serif;
      box-shadow:var(--shadow-md)
    }
    .sec-ttl{
      font-size:1.125rem;font-weight:700;letter-spacing:.05em;
      text-transform:uppercase;color:var(--primary-green);font-family:'Poppins',sans-serif
    }

    /* Video Cards */
    .vid-card{
      border:2px solid var(--vibrant-green);border-radius:16px;overflow:hidden;
      background:var(--bg-card);box-shadow:var(--shadow-md);
      transition:all var(--transition-fast);
      animation:fadeUp .5s ease both
    }
    .vid-card:hover{
      transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary-green)
    }
    .vid-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
    .vid-wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
    .vid-desc{
      padding:1.75rem;border-top:2px solid var(--vibrant-green);
      border-left:4px solid var(--vibrant-green)
    }
    .vid-desc-badges{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.875rem}
    .badge-accent{
      display:inline-flex;align-items:center;background:rgba(245,158,11,.15);
      border:1.5px solid var(--accent-amber);color:var(--accent-amber);border-radius:6px;
      padding:.3rem .75rem;font-size:.65rem;font-weight:700;letter-spacing:.06em;
      text-transform:uppercase;font-family:'Poppins',sans-serif
    }
    .badge-green{
      display:inline-flex;align-items:center;background:rgba(57,211,83,.12);
      border:1.5px solid var(--vibrant-green);color:var(--vibrant-green);border-radius:6px;
      padding:.3rem .75rem;font-size:.65rem;font-weight:700;letter-spacing:.06em;
      text-transform:uppercase;font-family:'Poppins',sans-serif
    }
    .vid-desc h3{
      font-size:1.25rem;font-weight:800;color:var(--primary-green);letter-spacing:.03em;
      text-transform:uppercase;margin-bottom:.5rem;font-family:'Poppins',sans-serif
    }
    .vid-desc p{font-size:.9375rem;color:var(--text-secondary);line-height:1.65;max-width:760px}

    /* Tabs */
    .tabs{display:flex;border-bottom:2px solid var(--vibrant-green)}
    .tab{
      flex:1;padding:.875rem 1rem;text-align:center;cursor:pointer;font-size:.8125rem;
      font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);
      display:flex;align-items:center;justify-content:center;gap:.5rem;
      border-bottom:3px solid transparent;transition:all var(--transition-fast);
      font-family:'Poppins',sans-serif
    }
    .tab.active{color:var(--primary-green);border-bottom-color:var(--vibrant-green)}
    .tab:hover{color:var(--primary-green)}
    .tab-pane{display:none}
    .tab-pane.active{display:block}

    /* Copy/Models */
    .copy-row{display:flex;align-items:center;gap:.625rem;margin-bottom:1.25rem;flex-wrap:wrap}
    .copy-btn{
      background:rgba(57,211,83,.12);color:var(--vibrant-green);border:1.5px solid var(--vibrant-green);
      border-radius:8px;padding:.5625rem 1.125rem;font-size:.8125rem;font-weight:700;
      cursor:pointer;white-space:nowrap;transition:all var(--transition-fast);
      display:flex;align-items:center;gap:.375rem;font-family:'Poppins',sans-serif
    }
    .copy-btn:hover{background:rgba(57,211,83,.22);transform:scale(1.02)}
    .copy-btn.copied{background:rgba(57,211,83,.25);color:var(--vibrant-green)}

    .modelo-item{
      background:rgba(57,211,83,.06);border:1.5px solid rgba(57,211,83,.2);
      border-radius:10px;padding:1rem 1.25rem;margin-bottom:.75rem;
      display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap
    }
    .modelo-label{
      font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:var(--vibrant-green);margin-bottom:.375rem;font-family:'Poppins',sans-serif
    }
    .modelo-text{
      font-size:.8125rem;color:var(--text-secondary);font-family:'Fira Code',monospace;
      word-break:break-all;line-height:1.5;flex:1
    }
    .modelos-title{
      font-size:.875rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
      color:var(--primary-green);margin:.5rem 0 1rem;font-family:'Poppins',sans-serif
    }

    /* Link button */
    .link-btn{
      display:inline-flex;align-items:center;gap:.625rem;
      background:rgba(57,211,83,.12);border:1.5px solid var(--vibrant-green);
      border-radius:10px;padding:.75rem 1.25rem;font-size:.875rem;font-weight:600;
      color:var(--primary-green);text-decoration:none;transition:all var(--transition-fast);
      margin-top:.5rem;font-family:'Poppins',sans-serif
    }
    .link-btn:hover{background:rgba(57,211,83,.22);transform:translateY(-2px);box-shadow:var(--shadow-md)}

    /* Checklist */
    .checklist{
      list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:.75rem;margin-bottom:2rem
    }
    .checklist li{
      display:flex;align-items:center;gap:.875rem;padding:1rem 1.25rem;border-radius:12px;
      background:rgba(57,211,83,.1);border:1.5px solid rgba(57,211,83,.25);
      font-size:.9375rem;color:var(--primary-green);font-weight:500;
      transition:all var(--transition-fast)
    }
    .checklist li:hover{background:rgba(57,211,83,.15);transform:translateY(-2px)}

    /* Reqs label */
    .reqs-label{
      font-size:.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:var(--vibrant-green);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;
      font-family:'Poppins',sans-serif
    }

    /* Generator cards */
    .gen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.25rem}
    .gen-card{
      background:var(--bg-card);border:2px solid var(--vibrant-green);border-radius:16px;
      padding:1.75rem;display:flex;align-items:flex-start;gap:1.25rem;
      text-decoration:none;transition:all var(--transition-fast);position:relative;overflow:hidden;
      box-shadow:var(--shadow-md)
    }
    .gen-card::before{
      content:'';position:absolute;inset:0;opacity:0;
      background:radial-gradient(ellipse 80% 60% at 0% 50%,rgba(57,211,83,.1),transparent);
      transition:opacity var(--transition-normal)
    }
    .gen-card:hover{
      border-color:var(--primary-green);box-shadow:var(--shadow-lg);
      transform:translateY(-4px)
    }
    .gen-card:hover::before{opacity:1}
    .gen-icon{
      width:52px;height:52px;border-radius:14px;display:flex;align-items:center;
      justify-content:center;flex-shrink:0;overflow:hidden;border:2px solid var(--vibrant-green)
    }
    .gen-icon img{width:100%;height:100%;object-fit:cover;display:block}
    .gen-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:.625rem}
    .gen-tag{
      display:inline-flex;align-items:center;background:rgba(245,158,11,.15);
      border:1.5px solid var(--accent-amber);color:var(--accent-amber);border-radius:6px;
      padding:.3rem .625rem;font-size:.6rem;font-weight:700;letter-spacing:.07em;
      text-transform:uppercase;align-self:flex-start;font-family:'Poppins',sans-serif
    }
    .gen-name{
      font-size:1rem;font-weight:800;color:var(--primary-green);letter-spacing:.04em;
      text-transform:uppercase;line-height:1.2;font-family:'Poppins',sans-serif
    }
    .gen-platform{font-size:.8125rem;color:var(--text-secondary);font-weight:500}
    .gen-access{
      display:flex;align-items:center;justify-content:center;gap:.5rem;
      background:rgba(57,211,83,.12);color:var(--vibrant-green);border:1.5px solid var(--vibrant-green);
      border-radius:9px;padding:.625rem 1rem;font-size:.8125rem;font-weight:700;
      transition:all var(--transition-fast);margin-top:.375rem;font-family:'Poppins',sans-serif
    }
    .gen-access:hover{background:rgba(57,211,83,.22);transform:scale(1.02)}

    /* Extension note */
    .ext-note{
      background:rgba(245,158,11,.1);border:1.5px solid var(--accent-amber);
      border-radius:10px;padding:1rem 1.25rem;margin:1.25rem 0
    }
    .ext-note-title{
      font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:var(--accent-amber);margin-bottom:.375rem;font-family:'Poppins',sans-serif
    }
    .ext-note p{font-size:.875rem;color:var(--text-secondary);line-height:1.55}
    .ext-note span{color:var(--primary-green);font-weight:600}
    .ext-steps{
      background:rgba(57,211,83,.06);border:1.5px solid rgba(57,211,83,.2);
      border-radius:10px;padding:1.25rem;margin-top:1rem
    }
    .ext-steps-title{
      font-size:.8125rem;font-weight:700;text-transform:uppercase;
      letter-spacing:.05em;color:var(--primary-green);margin-bottom:.875rem;font-family:'Poppins',sans-serif
    }
    .ext-step{
      display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.625rem;
      font-size:.875rem;color:var(--text-secondary);line-height:1.5
    }
    .ext-step:last-child{margin-bottom:0}
    .step-num{
      width:24px;height:24px;border-radius:50%;background:var(--vibrant-green);
      color:#fff;font-size:.6875rem;font-weight:800;display:flex;align-items:center;
      justify-content:center;flex-shrink:0;margin-top:.1rem;font-family:'Poppins',sans-serif
    }
    .ext-dl{
      display:inline-flex;align-items:center;gap:.75rem;
      background:rgba(57,211,83,.12);border:1.5px solid var(--vibrant-green);
      border-radius:10px;padding:.75rem 1.25rem;text-decoration:none;
      color:var(--primary-green);transition:all var(--transition-fast);margin-top:1.25rem;
      font-family:'Poppins',sans-serif;font-weight:700
    }
    .ext-dl:hover{background:rgba(57,211,83,.22);color:var(--vibrant-green);transform:translateY(-2px)}
    .ext-dl-info{text-align:left}
    .ext-dl-name{
      font-size:.9375rem;font-weight:700;text-transform:uppercase;
      letter-spacing:.04em;line-height:1;font-family:'Poppins',sans-serif
    }
    .ext-dl-sub{font-size:.75rem;color:var(--text-secondary);margin-top:.2rem}

    /* Refresher card */
    .refresher-card{
      background:var(--bg-card);border:2px solid var(--vibrant-green);
      border-radius:16px;padding:2rem;display:flex;align-items:flex-start;gap:1.5rem;
      flex-wrap:wrap;box-shadow:var(--shadow-md);
      transition:all var(--transition-fast)
    }
    .refresher-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
    .refresher-icon{
      width:56px;height:56px;border-radius:14px;background:rgba(57,211,83,.12);
      border:2px solid var(--vibrant-green);display:flex;align-items:center;
      justify-content:center;color:var(--vibrant-green);flex-shrink:0
    }
    .refresher-body{flex:1;min-width:200px}
    .refresher-tag{
      display:inline-flex;align-items:center;background:rgba(57,211,83,.12);
      border:1.5px solid var(--vibrant-green);color:var(--vibrant-green);border-radius:6px;
      padding:.3rem .75rem;font-size:.65rem;font-weight:700;letter-spacing:.06em;
      text-transform:uppercase;margin-bottom:.625rem;font-family:'Poppins',sans-serif
    }
    .refresher-name{
      font-size:1.25rem;font-weight:800;color:var(--primary-green);
      text-transform:uppercase;letter-spacing:.04em;margin-bottom:.5rem;font-family:'Poppins',sans-serif
    }
    .refresher-desc{font-size:.9375rem;color:var(--text-secondary);line-height:1.65;margin-bottom:1.25rem}

    /* Banner */
    .banner-wrap{border:2px solid var(--vibrant-green);border-radius:14px;overflow:hidden;margin-bottom:3rem;box-shadow:var(--shadow-md)}
    .banner-wrap img{width:100%;display:block}

    /* Footer */
    .footer{
      border-top:2px solid var(--vibrant-green);padding:2.5rem 1.5rem;text-align:center;
      background:rgba(57,211,83,.03)
    }
    .footer p{color:var(--text-secondary);font-size:.8125rem}
    .footer strong{color:var(--primary-green);font-family:'Poppins',sans-serif}

    /* Scrollbar */
    ::-webkit-scrollbar{width:8px}
    ::-webkit-scrollbar-track{background:var(--bg-light)}
    ::-webkit-scrollbar-thumb{background:var(--vibrant-green);border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:var(--primary-green)}
    ::selection{background:rgba(57,211,83,.3);color:var(--primary-green)}

    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideIn{from{width:0}to{width:100%}}
    @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    
    .fade-in{animation:fadeUp .32s ease both}
    svg{flex-shrink:0}
      
    .refresher-link{
      display:inline-flex;align-items:center;gap:.625rem;
      background:rgba(57,211,83,.12);color:var(--vibrant-green);border:1.5px solid var(--vibrant-green);
      border-radius:8px;padding:.625rem 1.25rem;font-size:.875rem;font-weight:700;
      text-decoration:none;transition:all var(--transition-fast);margin-top:.25rem;
      font-family:'Poppins',sans-serif
    }
    .refresher-link:hover{background:rgba(57,211,83,.22);transform:translateY(-2px)}
  </style>
</head>
<body>

<!-- APP -->
<div id="app"></div>

<script>
// ── Sound ──
var clickSound = new Audio('/assets/button-click.mp3');
clickSound.preload = 'auto';
document.addEventListener('click', function(e) {
  var t = e.target;
  while (t && t !== document) {
    var tag = (t.tagName || '').toLowerCase();
    var role = t.getAttribute && t.getAttribute('role');
    if (['button','a','input','select','label'].includes(tag) || ['button','link','tab'].includes(role)) {
      var s = clickSound.cloneNode(); s.volume = .55; s.play().catch(function(){});
      break;
    }
    t = t.parentNode;
  }
}, true);

// ── SVG helpers ──
var ICO = {

      '<div class="content"><div class="divider"></div>' +
      '<div class="sec-item fade-in">' +
        '<p class="reqs-label">Requisitos</p>' +
        '<ul class="checklist">' + reqHtml + '</ul>' +
      '</div>' +
      '<div class="sec-item fade-in">' +
        secHead(1, 'Bypass') +
        bypassCard +
      '</div>' +
      '</div>' + footer();
  }

// ── REFRESHERS ──
function pageRefreshers() {
    var refresherCard =
      '<div class="refresher-card fade-in">' +
        '<div class="refresher-icon">' +
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' +

// ── Router ──
var PAGES = {
  '/tutoriais':  pageTutoriais,
  '/metodos':    pageMetodos,
  '/geradores':  pageGeradores,
  '/bypassers':  pageBypassers,
  '/refreshers': pageRefreshers,
};

function navigate(path) {
  linkFalsoActive = 0;
  cookieActive = 0;
  history.pushState({}, '', path);
  render(path);
  window.scrollTo(0, 0);
}

window.addEventListener('popstate', function() {
  linkFalsoActive = 0;
  cookieActive = 0;
  render(location.pathname);
});

function render(path) {
  var app = document.getElementById('app');
  var fn = PAGES[path] || pageTutoriais;
  app.innerHTML = navbar() + fn();
  updateActive(path);
}

function updateActive(path) {
  document.querySelectorAll('.nav-link, .mob-link').forEach(function(el) {
    var r = el.getAttribute('data-route');
    if (r) el.classList.toggle('active', r === path);
  });
}

// ── Hamburger ──
function toggleMenu() {
  document.getElementById('mobile-menu').classList.toggle('open');
  document.getElementById('ham').classList.toggle('open');
}
function closeMenu() {
  document.getElementById('mobile-menu').classList.remove('open');
  document.getElementById('ham').classList.remove('open');
}

// ── Init ──
var initPath = location.pathname;
if (!PAGES[initPath]) {
  initPath = '/tutoriais';
  history.replaceState({}, '', '/tutoriais');
}
render(initPath);
</script>
</body>
